version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ergonomia-db
    environment:
      POSTGRES_USER: ergonomia
      POSTGRES_PASSWORD: ergonomia_dev
      POSTGRES_DB: ergonomia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergonomia"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ergonomia-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://ergonomia:ergonomia_dev@postgres:5432/ergonomia?sslmode=disable
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=8080
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./web:/app/web
    restart: unless-stopped

volumes:
  postgres_data:
