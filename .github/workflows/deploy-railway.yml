name: Deploy to Railway

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: railway deploy --service ${{ secrets.RAILWAY_SERVICE_ID }} --environment production

    - name: Run migrations
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        # Obtener variables de entorno de Railway
        railway variables --service ${{ secrets.RAILWAY_SERVICE_ID }}
        # Las migraciones se ejecutan automáticamente en el entrypoint
        echo "Migrations will run on startup"

    - name: Notify success
      if: success()
      run: |
        echo "✅ Deployed successfully to Railway!"
        echo "Health check: https://${{ secrets.RAILWAY_DOMAIN }}/health"
